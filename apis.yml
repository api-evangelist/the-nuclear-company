name: The Nuclear Company
description: 'The Nuclear Company (TNC) is a U.S.-based nuclear energy infrastructure firm deploying
  nuclear power at fleet scale with a "design once, build many" standardized construction approach.
  Through its Powerhouse Resources arm it provides maintenance, outage execution, turbine, electrical,
  and instrumentation services to nuclear plants nationwide, and its proprietary AI-driven Nuclear
  Operating System (NOS) manages deployment and operations across the nuclear lifecycle. The company
  publishes no public API, developer portal, or documentation surface; this profile tracks it as an
  API Evangelist network company and portfolio company of True Ventures.'
